<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamtube MAX - Ultra</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        :root {
            --bg-base: #050000;
            --red-main: #ff0000;
            --red-hover: #cc0000;
            --glass-bg: rgba(20, 0, 0, 0.55);
            --glass-border: rgba(255, 0, 0, 0.3);
            --text-light: #ffffff;
            --text-dim: #aaaaaa;
        }

        body { 
            margin: 0; padding: 0; 
            background: var(--bg-base) radial-gradient(circle at top, #150000 0%, var(--bg-base) 100%); 
            color: var(--text-light); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            height: 100vh; overflow: hidden; 
            display: flex; flex-direction: column;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--red-main); } 100% { transform: scale(1); } }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        .pop-anim { animation: pop 0.3s ease-out; }

        /* Liquid Glass применяется строго на объекты */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.05);
        }

        /* --- ЛОГОТИП (Прозрачность 20%, текст снизу красный) --- */
        .brand-logo {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,0,0,0.15);
            cursor: pointer; transition: 0.3s;
        }
        .brand-logo:hover { border-color: var(--red-main); }
        .logo-top { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #fff; line-height: 1; }
        .logo-bottom { font-size: 13px; font-weight: 900; color: var(--red-main); margin-top: 4px; letter-spacing: 4px;}

        /* --- КНОПКИ И ИНПУТЫ --- */
        .input-styled { 
            width: 100%; padding: 15px; border-radius: 8px; 
            background: rgba(0,0,0,0.7); border: 1px solid #444; 
            color: white; font-size: 16px; box-sizing: border-box; 
            margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        .input-styled:focus { border-color: var(--red-main); box-shadow: 0 0 10px rgba(255,0,0,0.2); }
        .btn-primary { 
            width: 100%; padding: 15px; border-radius: 8px; 
            background: var(--red-main); color: white; 
            font-weight: bold; font-size: 16px; border: none; 
            cursor: pointer; transition: 0.2s; 
        }
        .btn-primary:hover { background: var(--red-hover); transform: translateY(-2px); }
        .btn-action { 
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); 
            color: white; padding: 10px 18px; border-radius: 8px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-action:hover { background: rgba(255,0,0,0.15); }

        /* --- ВХОД И КАРКАС --- */
        #auth-gate { position: fixed; inset: 0; background: var(--bg-base); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 0.5s; }
        .auth-box { width: 90%; max-width: 380px; padding: 40px; text-align: center; }
        
        #app-layout { display: none; flex-direction: column; height: 100vh; }
        header { padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); background: rgba(5,0,0,0.85); z-index: 100; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--red-main); object-fit: cover; }

        .main-container { display: flex; flex-grow: 1; overflow: hidden; }
        
        /* БОКОВАЯ ПАНЕЛЬ */
        .sidebar { width: 250px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; justify-content: space-between; background: rgba(10,0,0,0.6); }
        @media(max-width: 768px) { .sidebar { display: none; } }
        .nav-section { display: flex; flex-direction: column; padding: 15px 0; }
        .nav-item { padding: 16px 25px; cursor: pointer; font-size: 16px; font-weight: bold; color: var(--text-dim); transition: 0.3s; display: flex; align-items: center; gap: 15px; border-left: 4px solid transparent;}
        .nav-item:hover { color: #fff; background: rgba(255,0,0,0.05); }
        .nav-item.active { background: rgba(255,0,0,0.15); color: #fff; border-left-color: var(--red-main); }
        
        .content-area { flex-grow: 1; overflow-y: auto; padding: 30px; position: relative; }
        @media(max-width: 768px) { .content-area { padding: 15px; } }

        /* --- ГЛАВНАЯ: СТРИМЫ --- */
        .streams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 25px; }
        .stream-card { cursor: pointer; padding: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .stream-card:hover { transform: translateY(-5px); border-color: var(--red-main); box-shadow: 0 5px 20px rgba(255,0,0,0.15); }
        .stream-thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; position: relative; overflow: hidden; }
        .stream-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: 0.3s; }
        .stream-card:hover .stream-thumb img { opacity: 0.8; }
        .live-badge { position: absolute; top: 10px; left: 10px; background: var(--red-main); padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; }
        .viewers-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 4px 8px; font-size: 12px; border-radius: 4px; font-weight: bold; border: 1px solid var(--glass-border);}
        .stream-info { display: flex; gap: 15px; margin-top: 15px; }
        .stream-title { font-weight: bold; font-size: 16px; margin: 0 0 5px 0; color: #fff;}
        .stream-author { color: var(--text-dim); font-size: 13px; margin: 0; }

        /* --- ПЛЕЕР И ОРГАНЫ УПРАВЛЕНИЯ --- */
        #stream-view, #studio-view { display: none; }
        .stream-layout { display: grid; grid-template-columns: 1fr 350px; gap: 25px; height: calc(100vh - 140px); }
        @media(max-width: 1024px) { .stream-layout { grid-template-columns: 1fr; height: auto; } }
        
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; background: #000; overflow: hidden; aspect-ratio: 16/9; border: 2px solid var(--glass-border); }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* ПАНЕЛЬ ПЛЕЕРА YOUTUBE-STYLE */
        .player-controls { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            padding: 15px; box-sizing: border-box; display: flex; gap: 15px; align-items: center; 
            opacity: 0; transition: opacity 0.3s;
        }
        .video-wrapper:hover .player-controls { opacity: 1; }
        
        /* Ползунок громкости */
        .vol-slider { width: 100px; cursor: pointer; accent-color: var(--red-main); }
        .icon-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: var(--red-main); transform: scale(1.1); }
        
        .stream-controls-bar { margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 15px;}
        .social-actions { display: flex; gap: 10px; }

        /* Чат */
        .chat-container { display: flex; flex-direction: column; height: 100%; }
        .chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--glass-border); }
        .chat-msg { font-size: 14px; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; border-left: 2px solid var(--red-main); word-break: break-word;}
        .chat-msg b { color: var(--red-main); margin-right: 5px;}
        .chat-input-area { display: flex; padding: 15px; gap: 10px; }
        .chat-input-area input { flex-grow: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 6px; outline:none; }
        .chat-input-area button { background: var(--red-main); color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* СТУДИЯ АВТОРА */
        .studio-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 30px; }
        .stat-card { text-align: center; padding: 30px; }
        .stat-card h3 { margin: 0; color: var(--text-dim); font-size: 14px; text-transform: uppercase; }
        .stat-card .value { font-size: 40px; font-weight: bold; color: var(--red-main); margin-top: 15px; }

        /* МОДАЛКА */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; z-index: 10000; }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 480px; padding: 35px; box-sizing: border-box; animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .close-modal { position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; transition: 0.2s;}
        .close-modal:hover { color: white; }

        /* FAB */
        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--red-main); color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 28px; cursor: pointer; box-shadow: 0 5px 25px rgba(255,0,0,0.4); z-index: 90; display: flex; justify-content: center; align-items: center; transition: 0.3s;}
        .fab:hover { transform: scale(1.1) rotate(5deg); }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="glass-panel auth-box">
            <div class="brand-logo" style="margin-bottom: 35px;">
                <div class="logo-top">STREAM</div>
                <div class="logo-bottom">MAX</div>
            </div>
            <input type="text" id="auth-username" class="input-styled" placeholder="Имя канала..." onkeypress="if(event.key === 'Enter') login()">
            <button class="btn-primary" onclick="login()">Войти в систему</button>
        </div>
    </div>

    <div id="app-layout">
        <header>
            <div class="brand-logo" onclick="switchView('home')">
                <div class="logo-top">STREAM</div>
                <div class="logo-bottom">MAX</div>
            </div>
            <div class="user-profile">
                <span id="header-username" style="font-weight: bold;"></span>
                <img id="header-avatar" class="avatar" src="">
                <button class="btn-action" style="padding: 6px 12px; font-size: 13px;" onclick="smoothLogout()">Выйти</button>
            </div>
        </header>

        <div class="main-container">
            <div class="sidebar">
                <div class="nav-section">
                    <div class="nav-item active" id="nav-home" onclick="switchView('home')"><span class="nav-icon">📺</span> Стримы</div>
                </div>
                <div class="nav-section">
                    <div class="nav-item" id="nav-studio" onclick="switchView('studio')"><span class="nav-icon">📊</span> Студия автора</div>
                </div>
            </div>

            <div class="content-area">
                
                <div id="home-view" class="fade-in">
                    <h2 style="margin-top:0;">Прямые эфиры</h2>
                    <div class="streams-grid" id="streams-grid"></div>
                </div>

                <div id="studio-view" class="fade-in">
                    <h2 style="margin-top:0;">Аналитика канала</h2>
                    <div class="studio-stats">
                        <div class="glass-panel stat-card">
                            <h3>Мои Подписчики</h3>
                            <div class="value" id="studio-subs">0</div>
                        </div>
                        <div class="glass-panel stat-card">
                            <h3>Лайков за все время</h3>
                            <div class="value" id="studio-total-likes">0</div>
                        </div>
                    </div>
                </div>

                <div id="stream-view" class="fade-in">
                    <button class="btn-action" style="margin-bottom: 20px;" onclick="switchView('home')">← Назад</button>
                    <div class="stream-layout">
                        <div>
                            <div class="video-wrapper">
                                <div class="live-badge">🔴 LIVE <span id="viewer-count" style="margin-left:5px;">👁 0</span></div>
                                <video id="main-video" playsinline webkit-playsinline autoplay muted></video>
                                
                                <div class="player-controls">
                                    <button class="icon-btn" onclick="toggleMute()" id="mute-btn" title="Вкл/Выкл звук">🔊</button>
                                    <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" title="Громкость">
                                    <div style="flex-grow: 1;"></div>
                                    <button class="icon-btn" onclick="togglePiP()" title="Свернуть стрим (Picture in Picture)">🔲</button>
                                    <button class="icon-btn" onclick="toggleFullScreen()" title="Во весь экран">⛶</button>
                                </div>
                            </div>

                            <div class="stream-controls-bar">
                                <div style="display: flex; gap: 15px; align-items: center;">
                                    <img id="stream-author-avatar" class="avatar" src="" style="width: 50px; height: 50px;">
                                    <div>
                                        <h2 id="stream-title" style="margin: 0; font-size: 22px;">Название</h2>
                                        <p id="stream-desc" style="margin: 5px 0 0 0; color: var(--text-dim); font-size: 14px;">Описание...</p>
                                    </div>
                                </div>
                                
                                <div class="social-actions" id="viewer-controls" style="display:none;">
                                    <button class="btn-action" id="btn-like" onclick="sendLike()">🤍 <span id="like-count">0</span></button>
                                    <button class="btn-action" id="btn-subscribe" onclick="toggleSub()">⭐ Подписаться</button>
                                </div>
                                <div class="social-actions" id="host-controls" style="display:none;">
                                    <button class="btn-action" onclick="flipCamera()">🔄 Сменить камеру</button>
                                    <button class="btn-action" style="border-color: #aa0000;" onclick="stopStream()">⏹ Завершить</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="glass-panel chat-container">
                            <h3 style="margin:0; padding: 15px; border-bottom: 1px solid var(--glass-border);">Чат эфира</h3>
                            <div class="chat-box" id="chat-box"></div>
                            <div class="chat-input-area">
                                <input type="text" id="chat-input" placeholder="Написать..." onkeypress="if(event.key==='Enter') sendChat()">
                                <button onclick="sendChat()">➤</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        
        <button class="fab" id="fab-start" onclick="openStreamModal()" title="Начать стрим">🎥</button>
    </div>

    <div class="modal-overlay" id="start-modal">
        <div class="glass-panel modal-content">
            <button class="close-modal" onclick="closeStreamModal()">✖</button>
            <h2 style="margin-top: 0;">Запуск эфира</h2>
            <input type="text" id="setup-title" class="input-styled" placeholder="Название стрима">
            <input type="text" id="setup-desc" class="input-styled" placeholder="Описание стрима">
            <button class="btn-primary" style="margin-top: 10px;" onclick="startStream()">Выйти в эфир</button>
        </div>
    </div>

    <script>
        let myName = "";
        let peer = null, localStream = null, isBroadcasting = false;
        let hostConnections = [], viewerConnection = null;
        let activeStreams = {};
        let currentFacingMode = "user";
        
        // Локальные данные
        let subscriptions = JSON.parse(localStorage.getItem('streammax_subs') || "[]");
        let myTotalLikes = parseInt(localStorage.getItem('streammax_likes') || "0");
        
        let currentHostAuthor = "";
        let currentStreamLikes = 0;

        let mqttClient = null, heartbeatInt = null;
        const TOPIC = "streamtube_max_ultra_v4";

        function getAvatar(n) { return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(n)}&backgroundColor=111111`; }

        window.onload = () => { 
            if(localStorage.getItem('streammax_user')) {
                myName = localStorage.getItem('streammax_user');
                document.getElementById('auth-gate').style.display = 'none';
                initApp();
            }
        };

        function login() {
            const input = document.getElementById('auth-username').value.trim();
            if(input.length > 2) {
                localStorage.setItem('streammax_user', input); myName = input;
                document.getElementById('auth-gate').style.opacity = '0';
                setTimeout(() => { document.getElementById('auth-gate').style.display = 'none'; initApp(); }, 500);
            }
        }

        function smoothLogout() {
            if(isBroadcasting) stopStream();
            if(viewerConnection) { peer.destroy(); viewerConnection = null; }
            localStorage.removeItem('streammax_user');
            const app = document.getElementById('app-layout'), auth = document.getElementById('auth-gate');
            app.style.opacity = '0'; 
            setTimeout(() => { app.style.display = 'none'; app.style.opacity = '1'; auth.style.display = 'flex'; setTimeout(() => { auth.style.opacity = '1'; }, 50); }, 300);
        }

        function initApp() {
            document.getElementById('app-layout').style.display = 'flex';
            document.getElementById('header-username').innerText = myName;
            document.getElementById('header-avatar').src = getAvatar(myName);
            document.getElementById('studio-subs').innerText = subscriptions.length;
            document.getElementById('studio-total-likes').innerText = myTotalLikes;
            initNetwork(); switchView('home');
        }

        function switchView(v) {
            ['home', 'studio', 'stream'].forEach(id => document.getElementById(id+'-view').style.display = 'none');
            document.getElementById('nav-home').classList.remove('active'); document.getElementById('nav-studio').classList.remove('active');
            
            document.getElementById(v+'-view').style.display = 'block';
            if(v !== 'stream') document.getElementById('fab-start').style.display = 'flex';
            else document.getElementById('fab-start').style.display = 'none';

            if(v === 'home') {
                document.getElementById('nav-home').classList.add('active');
                if(viewerConnection && !isBroadcasting) { peer.destroy(); viewerConnection = null; document.getElementById('main-video').srcObject = null;}
            }
            if(v === 'studio') document.getElementById('nav-studio').classList.add('active');
        }

        function initNetwork() {
            if(mqttClient) return;
            mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
            mqttClient.on('connect', () => { mqttClient.subscribe(TOPIC); setInterval(cleanupStreams, 3000); });
            mqttClient.on('message', (t, msg) => {
                try {
                    const data = JSON.parse(msg.toString());
                    if(data.type === 'live') { activeStreams[data.hostId] = { ...data.info, ts: Date.now() }; renderStreams(); } 
                    else if (data.type === 'offline') { delete activeStreams[data.hostId]; renderStreams(); }
                } catch(e) {}
            });
        }
        function cleanupStreams() {
            const now = Date.now(); let changed = false;
            for(let id in activeStreams) if (now - activeStreams[id].ts > 6000) { delete activeStreams[id]; changed = true; }
            if(changed) renderStreams();
        }

        function renderStreams() {
            const grid = document.getElementById('streams-grid'); grid.innerHTML = "";
            const keys = Object.keys(activeStreams);
            if(keys.length === 0) { grid.innerHTML = `<p style="color:#777;">Пока никто не стримит...</p>`; return; }
            keys.forEach((id, i) => {
                const s = activeStreams[id];
                grid.innerHTML += `
                    <div class="glass-panel stream-card" style="animation-delay: ${i*0.1}s" onclick="joinStream('${id}', '${s.title}', '${s.author}', '${s.desc}')">
                        <div class="stream-thumb"><img src="${getAvatar(s.author)}"><div class="live-badge">LIVE</div><div class="viewers-badge">👁 ${s.viewers} | 💖 ${s.likes}</div></div>
                        <div class="stream-info"><img src="${getAvatar(s.author)}" class="avatar" style="width:36px; height:36px;">
                            <div><div class="stream-title">${s.title}</div><div class="stream-author">${s.author}</div></div>
                        </div>
                    </div>`;
            });
        }

        /* --- ВЕЩАНИЕ (ХОСТ) --- */
        function openStreamModal() { document.getElementById('start-modal').style.display = 'block'; }
        function closeStreamModal() { document.getElementById('start-modal').style.display = 'none'; }

        async function startStream() {
            const title = document.getElementById('setup-title').value || "Прямой эфир";
            const desc = document.getElementById('setup-desc').value || "Без описания";
            closeStreamModal();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
                peer = new Peer({ config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} });
                
                peer.on('open', (id) => {
                    isBroadcasting = true; hostConnections = []; currentStreamLikes = 0;
                    switchView('stream');
                    document.getElementById('host-controls').style.display = 'flex';
                    document.getElementById('viewer-controls').style.display = 'none';
                    document.getElementById('stream-title').innerText = title; document.getElementById('stream-desc').innerText = desc;
                    document.getElementById('stream-author-avatar').src = getAvatar(myName);
                    document.getElementById('chat-box').innerHTML = ""; document.getElementById('like-count').innerText = "0";

                    const video = document.getElementById('main-video');
                    video.srcObject = localStream; video.muted = true; video.play().catch(()=>{});

                    heartbeatInt = setInterval(() => {
                        mqttClient.publish(TOPIC, JSON.stringify({ type: 'live', hostId: id, info: { title: title, desc: desc, author: myName, viewers: hostConnections.length, likes: currentStreamLikes } }));
                    }, 2000);
                });

                peer.on('connection', (conn) => {
                    hostConnections.push(conn); updateHostStats();
                    peer.call(conn.peer, localStream);
                    conn.on('data', (data) => {
                        if(data.type === 'chat') { appendChat(data.user, data.msg); hostConnections.forEach(c => { if(c.peer !== conn.peer) c.send(data); }); }
                        if(data.type === 'like') { currentStreamLikes++; updateHostStats(); animateLikeBtn(); }
                    });
                    conn.on('close', () => { hostConnections = hostConnections.filter(c => c.peer !== conn.peer); updateHostStats(); });
                });
            } catch(e) { alert("Разрешите доступ к камере/микрофону!"); }
        }

        async function flipCamera() {
            if(!isBroadcasting || !localStream) return;
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            try {
                const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                const newVideoTrack = newStream.getVideoTracks()[0];
                localStream.removeTrack(localStream.getVideoTracks()[0]); localStream.addTrack(newVideoTrack);
                document.getElementById('main-video').srcObject = localStream;
                for(let conns in peer.connections) {
                    peer.connections[conns].forEach(c => {
                        if(c.peerConnection) {
                            const sender = c.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if(sender) sender.replaceTrack(newVideoTrack);
                        }
                    });
                }
            } catch(e) { alert("Ошибка смены камеры"); }
        }

        function stopStream() {
            clearInterval(heartbeatInt);
            if(peer) { mqttClient.publish(TOPIC, JSON.stringify({ type: 'offline', hostId: peer.id })); peer.destroy(); }
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            
            // Сохраняем лайки со стрима в общую статистику
            myTotalLikes += currentStreamLikes;
            localStorage.setItem('streammax_likes', myTotalLikes);
            document.getElementById('studio-total-likes').innerText = myTotalLikes;
            
            isBroadcasting = false; switchView('home');
        }

        function updateHostStats() {
            const c = hostConnections.length; document.getElementById('viewer-count').innerText = `👁 ${c}`;
            document.getElementById('like-count').innerText = currentStreamLikes;
            hostConnections.forEach(conn => conn.send({ type: 'sys', viewers: c, likes: currentStreamLikes }));
        }

        /* --- ПРОСМОТР (ЗРИТЕЛЬ) --- */
        function joinStream(hostId, title, author, desc) {
            if(isBroadcasting) return;
            switchView('stream');
            document.getElementById('host-controls').style.display = 'none';
            document.getElementById('viewer-controls').style.display = 'flex';
            document.getElementById('chat-box').innerHTML = "";
            
            currentHostAuthor = author;
            document.getElementById('stream-title').innerText = title; document.getElementById('stream-desc').innerText = desc || "";
            document.getElementById('stream-author-avatar').src = getAvatar(author);
            checkSubStatus(); document.getElementById('like-count').innerText = "0";

            peer = new Peer({ config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} });
            peer.on('open', () => {
                viewerConnection = peer.connect(hostId);
                viewerConnection.on('data', (data) => {
                    if(data.type === 'chat') appendChat(data.user, data.msg);
                    if(data.type === 'sys') { 
                        document.getElementById('viewer-count').innerText = `👁 ${data.viewers}`;
                        document.getElementById('like-count').innerText = data.likes;
                    }
                });
                peer.on('call', (call) => {
                    call.answer();
                    call.on('stream', (hostStream) => {
                        const video = document.getElementById('main-video');
                        video.srcObject = hostStream;
                        video.muted = false; // Включаем звук у зрителя
                        document.getElementById('mute-btn').innerText = "🔊";
                        document.getElementById('vol-slider').value = 1;
                        video.play().catch(()=>{ console.log("Нужен клик для Play"); });
                    });
                });
            });
        }

        /* --- ФИШКИ: ЛАЙКИ И ПОДПИСКИ --- */
        function sendLike() {
            if(viewerConnection) {
                viewerConnection.send({ type: 'like' });
                animateLikeBtn();
            } else if (isBroadcasting) {
                currentStreamLikes++; updateHostStats(); animateLikeBtn();
            }
        }

        function animateLikeBtn() {
            const btn = document.getElementById('btn-like');
            btn.classList.remove('pop-anim');
            void btn.offsetWidth; // Trigger reflow
            btn.classList.add('pop-anim');
            btn.innerHTML = `❤️ <span id="like-count">${document.getElementById('like-count').innerText}</span>`;
            setTimeout(()=> btn.innerHTML = `🤍 <span id="like-count">${document.getElementById('like-count').innerText}</span>`, 300);
        }

        function checkSubStatus() {
            const btn = document.getElementById('btn-subscribe');
            if(subscriptions.includes(currentHostAuthor)) { btn.style.borderColor = var(--red-main); btn.style.background = 'rgba(255,0,0,0.2)'; btn.innerText = "★ Вы подписаны"; }
            else { btn.style.borderColor = var(--glass-border); btn.style.background = 'rgba(0,0,0,0.5)'; btn.innerText = "⭐ Подписаться"; }
        }

        function toggleSub() {
            if(subscriptions.includes(currentHostAuthor)) subscriptions = subscriptions.filter(s => s !== currentHostAuthor);
            else subscriptions.push(currentHostAuthor);
            localStorage.setItem('streammax_subs', JSON.stringify(subscriptions));
            document.getElementById('studio-subs').innerText = subscriptions.length;
            checkSubStatus();
        }

        /* --- ФИШКИ: ПЛЕЕР --- */
        const video = document.getElementById('main-video');
        
        function changeVolume(val) { 
            video.volume = val; 
            if(val == 0) document.getElementById('mute-btn').innerText = "🔇";
            else if(val < 0.5) document.getElementById('mute-btn').innerText = "🔉";
            else document.getElementById('mute-btn').innerText = "🔊";
        }
        
        function toggleMute() {
            if(video.volume > 0) { video.dataset.lastVol = video.volume; changeVolume(0); document.getElementById('vol-slider').value = 0; }
            else { const v = video.dataset.lastVol || 1; changeVolume(v); document.getElementById('vol-slider').value = v; }
        }

        function togglePiP() {
            if (document.pictureInPictureElement) document.exitPictureInPicture();
            else if (document.pictureInPictureEnabled) video.requestPictureInPicture();
            else alert("Сворачивание не поддерживается вашим браузером");
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.getElementById('stream-view').requestFullscreen();
            else document.exitFullscreen();
        }

        /* --- ЧАТ --- */
        function sendChat() {
            const input = document.getElementById('chat-input'); const msg = input.value.trim(); if(!msg) return;
            appendChat(myName, msg);
            if(isBroadcasting) hostConnections.forEach(c => c.send({ type: 'chat', user: myName, msg: msg }));
            else if(viewerConnection) viewerConnection.send({ type: 'chat', user: myName, msg: msg });
            input.value = "";
        }

        function appendChat(user, text) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-msg"><b>${user}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>

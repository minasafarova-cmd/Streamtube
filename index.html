<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamtube - Живые трансляции</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #050000; background-image: radial-gradient(circle at 50% 50%, #1a0000 0%, #000000 100%); color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        header { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 0, 0, 0.15); background: rgba(10, 0, 0, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 900; color: #ff0000; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255, 0, 0, 0.8); text-transform: uppercase; cursor: pointer; }
        
        .user-controls { display: flex; align-items: center; gap: 15px; }
        .btn-login { background: transparent; border: 1px solid #ff0000; color: #ff0000; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #ff0000; color: white; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        #logged-in-user { font-weight: bold; color: #fff; display: none; }

        .container { padding: 30px 40px; max-width: 1200px; margin: 0 auto; }

        /* Liquid Glass на самих объектах */
        .glass-panel { background: rgba(30, 0, 0, 0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 0, 0, 0.3); box-shadow: 0 8px 32px rgba(255, 0, 0, 0.15), inset 0 0 20px rgba(255, 0, 0, 0.05); border-radius: 16px; transition: all 0.3s ease; }
        
        .streams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .stream-item { padding: 15px; cursor: pointer; display: flex; flex-direction: column; aspect-ratio: 1 / 1; justify-content: space-between; position: relative; }
        .stream-item:hover { transform: translateY(-5px); border-color: rgba(255, 0, 0, 0.6); box-shadow: 0 10px 40px rgba(255, 0, 0, 0.25); }
        
        .stream-item.followed { border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        .followed-badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #ffd700; color: #000; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 10px; z-index: 2; box-shadow: 0 2px 10px rgba(255,215,0,0.5);}

        .thumb-placeholder { width: 100%; height: 60%; background: linear-gradient(45deg, rgba(30,0,0,0.5), rgba(80,0,0,0.5)); border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,0,0,0.2); position: relative; overflow: hidden; font-size: 40px; }
        .live-badge { position: absolute; top: 10px; left: 10px; background: #ff0000; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; animation: pulse 1.5s infinite; }
        .my-stream-badge { position: absolute; top: 10px; right: 10px; background: #00aa00; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; }
        .viewers-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 12px; border-radius: 4px; border: 1px solid rgba(255,0,0,0.3); font-weight: bold; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.7); } 70% { box-shadow: 0 0 0 8px rgba(255,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); } }

        .stream-title { font-weight: bold; font-size: 1.2em; color: #fff; margin: 10px 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .stream-author { color: #ff5555; font-size: 0.9em; }

        .btn-fab { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #ff0000 0%, #990000 100%); color: white; border: 1px solid #ff5555; padding: 16px 32px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 0, 0.5); transition: 0.3s; z-index: 100; }
        .btn-fab:hover { transform: scale(1.05); box-shadow: 0 0 35px #ff0000; }
        .btn-fab.active-mode { background: linear-gradient(135deg, #00aa00 0%, #005500 100%); border-color: #00ff00; box-shadow: 0 0 25px rgba(0, 255, 0, 0.3); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { width: 90%; max-width: 400px; padding: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ccc; font-size: 0.9em; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,0,0,0.3); color: white; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 14px; border-radius: 8px; background: #ff0000; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }

        #stream-page { display: none; }
        .stream-layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 30px; margin-top: 15px; }
        @media(max-width: 900px) { .stream-layout { grid-template-columns: 1fr; } }

        .video-container { position: relative; width: 100%; border-radius: 12px; border: 2px solid #ff0000; background: #000; overflow: hidden; display: flex; justify-content: center; }
        video { width: 100%; height: auto; max-height: 70vh; object-fit: contain; }
        
        .channel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-subscribe { background: transparent; border: 1px solid #ffd700; color: #ffd700; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-subscribe.active { background: #ffd700; color: #000; }

        .chat-panel { display: flex; flex-direction: column; height: 600px; padding: 20px; }
        .chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }
        .msg { margin-bottom: 10px; font-size: 0.95em; border-bottom: 1px solid rgba(255,0,0,0.1); padding-bottom: 5px; word-wrap: break-word; }
        .msg-user { color: #ff3333; font-weight: bold; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex-grow: 1; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,0,0,0.3); color: white; }
        .chat-input-row button { padding: 10px 20px; background: #ff0000; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;}

        .header-controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;}
        .btn-secondary { background: rgba(255,0,0,0.1); border: 1px solid #ff0000; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-secondary:hover { background: #ff0000; }
        
        .reactions-bar { display: flex; gap: 10px; margin-top: 15px; }
        .react-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,0,0,0.3); font-size: 24px; padding: 10px; border-radius: 8px; cursor: pointer; }
        .floating-reaction { position: absolute; bottom: 0; font-size: 40px; pointer-events: none; animation: floatUp 2.5s forwards ease-out; z-index: 50; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { transform: translateY(-50px) scale(1.2); opacity: 1; } 100% { transform: translateY(-400px) scale(1); opacity: 0; } }

        /* Мини-плеер для хоста */
        #mini-host-player { position: fixed; bottom: 100px; right: 30px; width: 200px; border: 2px solid #00ff00; border-radius: 10px; background: #000; z-index: 90; display: none; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
        #mini-host-video { width: 100%; border-radius: 8px; }
        .mini-label { position: absolute; top: -10px; left: 10px; background: #00aa00; padding: 2px 8px; font-size: 10px; border-radius: 4px; font-weight: bold;}
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showMenu()">Streamtube</div>
        <div class="user-controls">
            <span id="logged-in-user"></span>
            <button class="btn-login" id="btn-login-open" onclick="openLoginModal()">Войти</button>
        </div>
    </header>

    <div id="menu-page" class="container">
        <h2 style="color: #ff3333; margin-top: 0;">Доступные трансляции</h2>
        <div class="streams-grid" id="streams-container"></div>
    </div>

    <div class="modal-overlay" id="login-modal">
        <div class="glass-panel modal-content">
            <h3 style="color: #ff0000; margin-top: 0;">Регистрация / Вход</h3>
            <div class="form-group">
                <label>Ваш Никнейм</label>
                <input type="text" id="login-name" placeholder="Придумайте ник">
            </div>
            <button class="submit-btn" onclick="saveLogin()">ВОЙТИ</button>
            <button class="submit-btn" style="background:rgba(255,255,255,0.1);" onclick="closeModals()">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="stream-modal">
        <div class="glass-panel modal-content">
            <h3 style="color: #ff0000; margin-top: 0;">Настройки эфира</h3>
            <div class="form-group"><label>Название стрима</label><input type="text" id="form-title" placeholder="Мой крутой стрим"></div>
            <div class="form-group"><label>Описание</label><input type="text" id="form-desc" placeholder="Залетайте!"></div>
            <button class="submit-btn" onclick="startMyStream()">НАЧАТЬ ЭФИР</button>
            <button class="submit-btn" style="background:rgba(255,255,255,0.1);" onclick="closeModals()">Отмена</button>
        </div>
    </div>

    <div id="stream-page" class="container">
        <div class="header-controls">
            <button class="btn-secondary" onclick="minimizeStream()">← На главную</button>
            <button class="btn-secondary" id="btn-screen-share" style="display:none;" onclick="startScreenShare()">Показать экран 💻</button>
            <button class="btn-secondary" style="background:#cc0000; border:none; display:none;" id="btn-stop-stream" onclick="stopMyStream()">ОСТАНОВИТЬ СТРИМ ⏹</button>
        </div>
        
        <div class="stream-layout">
            <div>
                <div class="video-container" id="video-wrapper">
                    <video id="main-video" autoplay playsinline></video>
                </div>
                <div class="glass-panel info-panel">
                    <div class="channel-header">
                        <div>
                            <h2 id="view-title" style="margin: 0 0 5px 0;">Загрузка...</h2>
                            <p id="view-author" style="color: #ff5555; font-weight: bold; margin: 0;"></p>
                        </div>
                        <button id="btn-sub" class="btn-subscribe" style="display:none;" onclick="toggleSubscribe()">⭐ Подписаться</button>
                    </div>
                    <p id="view-desc" style="color: #ccc; margin-top: 10px;"></p>
                    
                    <div class="reactions-bar" id="viewer-reactions" style="display: none;">
                        <button class="react-btn" onclick="sendReaction('🔥')">🔥</button>
                        <button class="react-btn" onclick="sendReaction('❤️')">❤️</button>
                        <button class="react-btn" onclick="sendReaction('😎')">😎</button>
                        <button class="react-btn" onclick="sendReaction('😂')">😂</button>
                    </div>
                </div>
            </div>
            <div class="glass-panel chat-panel">
                <h3 style="margin-top:0; color: #ff3333;">Чат</h3>
                <div class="chat-messages" id="chat-messages-box"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input-field" placeholder="Написать...">
                    <button onclick="submitChatMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-fab" id="fab-btn" onclick="handleFabClick()">ЗАПУСТИТЬ СТРИМ</button>

    <div id="mini-host-player">
        <div class="mini-label">Ваш эфир</div>
        <video id="mini-host-video" autoplay muted playsinline></video>
    </div>

    <script>
        // --- БАЗА И АККАУНТЫ ---
        let myUsername = localStorage.getItem('streamtube_user') || "Зритель_" + Math.floor(Math.random()*9000);
        let subscriptions = JSON.parse(localStorage.getItem('streamtube_subs') || "[]");
        let currentViewingAuthor = "";

        function updateUIAuth() {
            if (localStorage.getItem('streamtube_user')) {
                document.getElementById('logged-in-user').innerText = myUsername;
                document.getElementById('logged-in-user').style.display = 'block';
                document.getElementById('btn-login-open').innerText = "Сменить аккаунт";
            }
        }
        updateUIAuth();

        function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeModals() { document.getElementById('login-modal').style.display = 'none'; document.getElementById('stream-modal').style.display = 'none'; }
        
        function saveLogin() {
            const name = document.getElementById('login-name').value.trim();
            if(name) {
                myUsername = name;
                localStorage.setItem('streamtube_user', name);
                updateUIAuth();
                closeModals();
            }
        }

        // --- ПОДПИСКИ ---
        function toggleSubscribe() {
            const btn = document.getElementById('btn-sub');
            if (subscriptions.includes(currentViewingAuthor)) {
                subscriptions = subscriptions.filter(sub => sub !== currentViewingAuthor);
                btn.classList.remove('active'); btn.innerText = "⭐ Подписаться";
            } else {
                subscriptions.push(currentViewingAuthor);
                btn.classList.add('active'); btn.innerText = "⭐ ВЫ ПОДПИСАНЫ";
            }
            localStorage.setItem('streamtube_subs', JSON.stringify(subscriptions));
            renderMenu(); // Обновляем рамки в меню
        }

        // --- СЕТЬ И ПЕРЕМЕННЫЕ ---
        let peer = null; let myStream = null; let originalCamTrack = null;
        let isHost = false; let hostConnections = []; let viewerConn = null;
        
        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const GLOBAL_TOPIC = "streamtube_global_network_v3_final";
        let activeStreamsMap = {}; let heartbeatInterval = null;

        mqttClient.on('connect', () => {
            mqttClient.subscribe(GLOBAL_TOPIC);
            setInterval(cleanupDeadStreams, 4000);
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.action === 'live') {
                    activeStreamsMap[data.peerId] = { ...data.info, lastSeen: Date.now() };
                    renderMenu();
                } else if (data.action === 'offline') {
                    delete activeStreamsMap[data.peerId];
                    renderMenu();
                }
            } catch (e) { }
        });

        function cleanupDeadStreams() {
            const now = Date.now(); let changed = false;
            for (const id in activeStreamsMap) {
                if (now - activeStreamsMap[id].lastSeen > 12000) { delete activeStreamsMap[id]; changed = true; }
            }
            if(changed) renderMenu();
        }

        // --- ФИКС ЗАКРЫТИЯ ВКЛАДКИ (ПРИЗРАЧНЫЕ СТРИМЫ) ---
        window.addEventListener('beforeunload', (e) => {
            if (isHost) {
                mqttClient.publish(GLOBAL_TOPIC, JSON.stringify({ action: 'offline', peerId: peer.id }));
                e.preventDefault(); e.returnValue = 'Эфир прервется!';
                return e.returnValue;
            }
        });

        // --- МЕНЮ И ИНТЕРФЕЙС ---
        function showMenu() {
            document.getElementById('stream-page').style.display = 'none';
            document.getElementById('menu-page').style.display = 'block';
            
            // Если мы ведем стрим, показываем наш стрим в мини-плеере
            if(isHost) {
                document.getElementById('mini-host-player').style.display = 'block';
                document.getElementById('fab-btn').innerText = "ВЕРНУТЬСЯ В ЭФИР";
                document.getElementById('fab-btn').classList.add('active-mode');
            } else {
                document.getElementById('fab-btn').innerText = "ЗАПУСТИТЬ СТРИМ";
                document.getElementById('fab-btn').classList.remove('active-mode');
            }
            
            // Если мы смотрели кого-то и вышли - отключаемся
            if(viewerConn && !isHost) {
                peer.destroy(); viewerConn = null;
                document.getElementById('main-video').srcObject = null;
            }
        }

        function renderMenu() {
            const container = document.getElementById('streams-container');
            container.innerHTML = ""; const streamKeys = Object.keys(activeStreamsMap);

            if (streamKeys.length === 0) {
                container.innerHTML = `<div class="empty-state"><span>😢</span>Пока никто не стримит...<br>Стань первым!</div>`;
                return;
            }

            streamKeys.forEach(id => {
                const stream = activeStreamsMap[id];
                const isMyStream = (peer && peer.id === id);
                const isFollowed = subscriptions.includes(stream.author);

                const card = document.createElement('div');
                card.className = `glass-panel stream-item ${isFollowed ? 'followed' : ''}`;
                
                card.innerHTML = `
                    ${isFollowed ? `<div class="followed-badge">ВЫ ПОДПИСАНЫ</div>` : ''}
                    <div class="thumb-placeholder">
                        🎥
                        ${isMyStream ? `<div class="my-stream-badge">ВЫ В ЭФИРЕ</div>` : `<div class="live-badge">LIVE</div>`}
                        <div class="viewers-badge">👁 ${stream.viewers}</div>
                    </div>
                    <div class="stream-title">${stream.title}</div>
                    <div class="stream-author">${isMyStream ? "Ваш стрим" : stream.author}</div>
                `;

                card.onclick = () => {
                    if (isMyStream) handleFabClick(); // Возврат в свой стрим
                    else joinStream(id, stream);
                };
                container.appendChild(card);
            });
        }

        function handleFabClick() {
            if (isHost) {
                document.getElementById('mini-host-player').style.display = 'none';
                document.getElementById('menu-page').style.display = 'none';
                document.getElementById('stream-page').style.display = 'block';
                document.getElementById('fab-btn').style.display = 'none'; // Скрываем кнопку FAB в режиме студии
                
                // Переносим видео обратно на большой экран
                document.getElementById('main-video').srcObject = myStream;
                document.getElementById('main-video').muted = true;
                
                // Настраиваем UI для хоста
                setupHostUI();
            } else {
                document.getElementById('stream-modal').style.display = 'flex';
            }
        }

        function minimizeStream() { showMenu(); document.getElementById('fab-btn').style.display = 'block'; }

        function setupHostUI() {
            document.getElementById('btn-stop-stream').style.display = 'block';
            document.getElementById('btn-screen-share').style.display = 'block';
            document.getElementById('btn-sub').style.display = 'none';
            document.getElementById('viewer-reactions').style.display = 'flex';
        }

        // --- ЛОГИКА ХОСТА ---
        async function startMyStream() {
            const title = document.getElementById('form-title').value || "Стрим";
            const desc = document.getElementById('form-desc').value;
            closeModals();

            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                originalCamTrack = myStream.getVideoTracks()[0]; // Запоминаем камеру
                
                peer = new Peer();
                peer.on('open', (id) => {
                    isHost = true;
                    document.getElementById('menu-page').style.display = 'none';
                    document.getElementById('stream-page').style.display = 'block';
                    document.getElementById('fab-btn').style.display = 'none';
                    setupHostUI();

                    document.getElementById('main-video').srcObject = myStream;
                    document.getElementById('main-video').muted = true; // Себя не слушаем
                    document.getElementById('mini-host-video').srcObject = myStream;

                    document.getElementById('view-title').innerText = title;
                    document.getElementById('view-author').innerText = myUsername + " (Вы)";
                    document.getElementById('view-desc').innerText = desc;
                    document.getElementById('chat-messages-box').innerHTML = "";

                    // Отправка в сеть
                    heartbeatInterval = setInterval(() => {
                        mqttClient.publish(GLOBAL_TOPIC, JSON.stringify({
                            action: 'live', peerId: id,
                            info: { title, author: myUsername, desc, viewers: hostConnections.length }
                        }));
                    }, 3000);
                });

                peer.on('connection', (conn) => {
                    hostConnections.push(conn);
                    conn.on('data', (data) => {
                        if (data.type === "chat") { addChatMsg(data.user, data.text); broadcast({ ...data }); }
                        if (data.type === "react") { spawnReaction(data.emoji); broadcast({ ...data }); }
                    });
                    conn.on('close', () => { hostConnections = hostConnections.filter(c => c !== conn); });
                });
                peer.on('call', (call) => { call.answer(myStream); });

            } catch (e) { alert("Ошибка камеры! Разрешите доступ в браузере."); }
        }

        function broadcast(obj) { hostConnections.forEach(c => { if(c.open) c.send(obj); }); }

        // --- ДЕМОНСТРАЦИЯ ЭКРАНА С АВТОВОЗВРАТОМ КАМЕРЫ ---
        async function startScreenShare() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                
                // Заменяем трек у себя
                myStream.removeTrack(myStream.getVideoTracks()[0]);
                myStream.addTrack(screenTrack);
                
                // Рассылаем всем зрителям
                for(let key in peer.connections) {
                    let conns = peer.connections[key];
                    for(let i=0; i<conns.length; i++) {
                        if(conns[i].peerConnection) {
                            const sender = conns[i].peerConnection.getSenders().find(s => s.track.kind === 'video');
                            if(sender) sender.replaceTrack(screenTrack);
                        }
                    }
                }

                // Когда показ экрана останавливается системной кнопкой
                screenTrack.onended = () => {
                    myStream.removeTrack(screenTrack);
                    myStream.addTrack(originalCamTrack); // Возвращаем сохраненную камеру
                    
                    // Возвращаем зрителям камеру
                    for(let key in peer.connections) {
                        let conns = peer.connections[key];
                        for(let i=0; i<conns.length; i++) {
                            if(conns[i].peerConnection) {
                                const sender = conns[i].peerConnection.getSenders().find(s => s.track.kind === 'video');
                                if(sender) sender.replaceTrack(originalCamTrack);
                            }
                        }
                    }
                };
            } catch (e) { console.error("Ошибка экрана", e); }
        }

        function stopMyStream() {
            if (!confirm("Завершить эфир?")) return;
            mqttClient.publish(GLOBAL_TOPIC, JSON.stringify({ action: 'offline', peerId: peer.id }));
            clearInterval(heartbeatInterval);
            if (myStream) myStream.getTracks().forEach(t => t.stop());
            if (originalCamTrack) originalCamTrack.stop();
            if (peer) peer.destroy();
            
            isHost = false; hostConnections = [];
            document.getElementById('mini-host-player').style.display = 'none';
            showMenu(); document.getElementById('fab-btn').style.display = 'block';
            renderMenu();
        }

        // --- ЗРИТЕЛЬ ---
        function joinStream(targetId, streamData) {
            document.getElementById('menu-page').style.display = 'none';
            document.getElementById('stream-page').style.display = 'block';
            document.getElementById('fab-btn').style.display = 'none';
            
            document.getElementById('btn-stop-stream').style.display = 'none';
            document.getElementById('btn-screen-share').style.display = 'none';
            document.getElementById('viewer-reactions').style.display = 'flex';
            
            // Настройка подписок
            currentViewingAuthor = streamData.author;
            const subBtn = document.getElementById('btn-sub');
            subBtn.style.display = 'block';
            if (subscriptions.includes(currentViewingAuthor)) { subBtn.classList.add('active'); subBtn.innerText = "⭐ ВЫ ПОДПИСАНЫ"; }
            else { subBtn.classList.remove('active'); subBtn.innerText = "⭐ Подписаться"; }

            document.getElementById('view-title').innerText = streamData.title;
            document.getElementById('view-author').innerText = streamData.author;
            document.getElementById('view-desc').innerText = streamData.desc || "";
            document.getElementById('chat-messages-box').innerHTML = "";

            peer = new Peer();
            peer.on('open', () => {
                viewerConn = peer.connect(targetId);
                viewerConn.on('data', (data) => {
                    if (data.type === "chat") addChatMsg(data.user, data.text);
                    if (data.type === "react") spawnReaction(data.emoji);
                });
                peer.call(targetId, null).on('stream', (rStream) => {
                    document.getElementById('main-video').srcObject = rStream;
                    document.getElementById('main-video').muted = false; // Звук зрителям включаем!
                });
            });
        }

        // --- ЧАТ И РЕАКЦИИ ---
        function submitChatMessage() {
            const input = document.getElementById('chat-input-field');
            if(!input.value.trim()) return;
            const txt = input.value;
            
            if (isHost) {
                addChatMsg(myUsername + " (Хост)", txt); broadcast({ type: "chat", user: myUsername + " (Хост)", text: txt });
            } else if (viewerConn) {
                addChatMsg(myUsername, txt); viewerConn.send({ type: "chat", user: myUsername, text: txt });
            }
            input.value = "";
        }

        function addChatMsg(u, t) {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML += `<div class="msg"><span class="msg-user">${u}:</span> ${t}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('chat-input-field').addEventListener('keypress', (e) => { if(e.key === 'Enter') submitChatMessage(); });

        function sendReaction(emj) {
            spawnReaction(emj);
            if (isHost) broadcast({ type: "react", emoji: emj });
            else if (viewerConn) viewerConn.send({ type: "react", emoji: emj });
        }

        function spawnReaction(emj) {
            const wrap = document.getElementById('video-wrapper');
            const el = document.createElement('div'); el.className = 'floating-reaction'; el.innerText = emj;
            el.style.left = (Math.random() * 80 + 10) + "%"; 
            wrap.appendChild(el); setTimeout(() => el.remove(), 2500);
        }
    </script>
</body>
</html>

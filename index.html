<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamtube - Живые трансляции</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #050000;
            background-image: radial-gradient(circle at 50% 50%, #1a0000 0%, #000000 100%);
            color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh; overflow-x: hidden;
        }

        header {
            padding: 20px 40px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid rgba(255, 0, 0, 0.15);
        }

        .logo {
            font-size: 28px; font-weight: 900; color: #ff0000;
            letter-spacing: 2px; text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            text-transform: uppercase;
        }

        .container { padding: 30px 40px; max-width: 1200px; margin: 0 auto; }

        /* Истинный эффект Liquid Glass: 20% прозрачности */
        .glass-panel {
            background: rgba(30, 0, 0, 0.2); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 0, 0.3);
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.15), inset 0 0 20px rgba(255, 0, 0, 0.05);
            border-radius: 16px; transition: all 0.3s ease;
        }
        .glass-panel:hover {
            border-color: rgba(255, 0, 0, 0.6);
            box-shadow: 0 10px 40px rgba(255, 0, 0, 0.25);
        }

        .streams-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; margin-top: 20px;
        }

        .stream-item {
            padding: 15px; cursor: pointer; display: flex; flex-direction: column;
            aspect-ratio: 1 / 1; justify-content: space-between; position: relative;
        }
        .stream-item:hover { transform: translateY(-5px); }

        .thumb-placeholder {
            width: 100%; height: 60%;
            background: linear-gradient(45deg, rgba(30,0,0,0.5), rgba(80,0,0,0.5));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,0,0,0.2); position: relative; overflow: hidden;
            font-size: 40px;
        }

        .live-badge {
            position: absolute; top: 10px; left: 10px;
            background: #ff0000; padding: 4px 8px; font-size: 11px;
            font-weight: bold; border-radius: 4px;
            animation: pulse 1.5s infinite; text-transform: uppercase;
        }
        .my-stream-badge {
            position: absolute; top: 10px; right: 10px;
            background: #00aa00; padding: 4px 8px; font-size: 11px;
            font-weight: bold; border-radius: 4px;
        }

        .viewers-badge {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 12px;
            border-radius: 4px; border: 1px solid rgba(255,0,0,0.3); font-weight: bold;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
            70% { box-shadow: 0 0 0 8px rgba(255,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); }
        }

        .stream-meta { margin-top: 10px; }
        .stream-title { font-weight: bold; font-size: 1.2em; color: #fff; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .stream-author { color: #ff5555; font-size: 0.9em; }

        .empty-state { text-align: center; padding: 50px 20px; color: #888; font-size: 1.2em; grid-column: 1 / -1; }
        .empty-state span { font-size: 3em; display: block; margin-bottom: 15px; }

        .btn-fab {
            position: fixed; bottom: 30px; right: 30px;
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
            color: white; border: 1px solid #ff5555;
            padding: 16px 32px; font-size: 16px; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            transition: 0.3s; z-index: 100;
        }
        .btn-fab:hover { transform: scale(1.05); box-shadow: 0 0 35px #ff0000; }
        .btn-fab.active-stream-mode { background: linear-gradient(135deg, #00aa00 0%, #005500 100%); border-color: #00ff00; box-shadow: 0 0 25px rgba(0, 255, 0, 0.3); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content { width: 90%; max-width: 500px; padding: 30px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 8px;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,0,0,0.3);
            color: white; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .form-group input:focus { border-color: #ff0000; }
        .submit-btn { width: 100%; padding: 14px; border-radius: 8px; background: #ff0000; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; margin-top: 10px;}

        #stream-page { display: none; }
        .stream-layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 30px; margin-top: 15px; }
        @media(max-width: 900px) { .stream-layout { grid-template-columns: 1fr; } }

        .video-container { position: relative; width: 100%; border-radius: 12px; border: 2px solid #ff0000; background: #000; box-shadow: 0 0 20px rgba(255,0,0,0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: auto; max-height: 70vh; object-fit: contain; }
        
        .info-panel { padding: 20px; margin-top: 15px; position: relative; }
        
        .chat-panel { display: flex; flex-direction: column; height: 600px; padding: 20px; }
        .chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        .msg { margin-bottom: 10px; font-size: 0.95em; border-bottom: 1px solid rgba(255,0,0,0.1); padding-bottom: 5px; word-wrap: break-word;}
        .msg-user { color: #ff3333; font-weight: bold; }
        .msg-sys { color: #888; font-style: italic; font-size: 0.85em; text-align: center; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex-grow: 1; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,0,0,0.3); color: white; }
        .chat-input-row button { padding: 10px 20px; background: #ff0000; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;}

        .header-controls { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-secondary { background: rgba(255,0,0,0.1); border: 1px solid #ff0000; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-secondary:hover { background: #ff0000; }
        .btn-stop-stream { background: #cc0000; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
        
        .reactions-bar { display: flex; gap: 10px; margin-top: 15px; }
        .react-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,0,0,0.3); font-size: 24px; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .react-btn:hover { background: rgba(255,0,0,0.3); transform: scale(1.1); }
        
        /* Анимация летящих эмодзи поверх видео */
        .floating-reaction { 
            position: absolute; bottom: 0; 
            font-size: 40px; pointer-events: none; 
            animation: floatUp 2.5s forwards ease-out; z-index: 50; 
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            20% { transform: translateY(-50px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-400px) scale(1); opacity: 0; } 
        }

        #live-viewers-count {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px;
            border: 1px solid red; font-weight: bold; color: white; display: none; z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Streamtube</div>
        <div id="username-display" style="color: #aaa; font-weight: bold;"></div>
    </header>

    <div id="menu-page" class="container">
        <h2 style="color: #ff3333; margin-top: 0;">Доступные трансляции</h2>
        <div class="streams-grid" id="streams-container"></div>
    </div>

    <div id="stream-page" class="container">
        <div class="header-controls">
            <button class="btn-secondary" onclick="minimizeStream()">← Свернуть меню</button>
            <button class="btn-secondary" id="btn-screen-share" style="display:none;" onclick="startScreenShare()">Показать экран 💻</button>
            <button class="btn-secondary" onclick="toggleFullscreen()">На весь экран 🔲</button>
            <button class="btn-stop-stream" id="btn-stop-stream" onclick="stopMyStream()">ОСТАНОВИТЬ СТРИМ ⏹</button>
        </div>
        
        <div class="stream-layout">
            <div>
                <div class="video-container" id="video-wrapper">
                    <div id="live-viewers-count">👁 0</div>
                    <video id="main-video" autoplay playsinline></video>
                </div>
                <div class="glass-panel info-panel">
                    <h2 id="view-title" style="margin: 0 0 10px 0;">Загрузка...</h2>
                    <p id="view-author" style="color: #ff5555; font-weight: bold; margin: 0 0 10px 0;"></p>
                    <p id="view-desc" style="color: #ccc; line-height: 1.5;"></p>
                    
                    <div class="reactions-bar" id="viewer-reactions" style="display: none;">
                        <button class="react-btn" onclick="sendReaction('🔥')">🔥</button>
                        <button class="react-btn" onclick="reactAndSend('❤️')">❤️</button>
                        <button class="react-btn" onclick="reactAndSend('😎')">😎</button>
                        <button class="react-btn" onclick="reactAndSend('😂')">😂</button>
                    </div>
                </div>
            </div>

            <div class="glass-panel chat-panel">
                <h3 style="margin-top:0; color: #ff3333;">Чат</h3>
                <div class="chat-messages" id="chat-messages-box"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input-field" placeholder="Написать в чат...">
                    <button onclick="submitChatMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-fab" id="fab-btn" onclick="handleFabClick()">ЗАПУСТИТЬ СТРИМ</button>

    <div class="modal-overlay" id="stream-modal">
        <div class="glass-panel modal-content">
            <h3 style="color: #ff0000; text-transform: uppercase; margin-top: 0;">Создать трансляцию</h3>
            <div class="form-group">
                <label>Название стрима *</label>
                <input type="text" id="form-title" placeholder="Крутой стрим">
            </div>
            <div class="form-group">
                <label>Ваш Никнейм *</label>
                <input type="text" id="form-author" placeholder="Steve...">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="form-desc" rows="2" placeholder="Залетайте, всем рад!"></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="submit-btn" onclick="startMyStream()">НАЧАТЬ ЭФИР</button>
                <button class="submit-btn" style="background:rgba(255,255,255,0.1);" onclick="toggleModal(false)">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let myStream = null;
        let isHost = false; 
        let isViewing = false;
        
        let hostConnections = []; 
        let viewerConn = null; 
        
        let myNickname = "Зритель_" + Math.floor(Math.random() * 9000);
        document.getElementById('username-display').innerText = "Вы: " + myNickname;

        // Глобальный поиск (Обновленный топик для стабильности)
        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const GLOBAL_TOPIC = "streamtube_global_network_v2_mega";
        let activeStreamsMap = {}; 
        let heartbeatInterval = null;

        mqttClient.on('connect', () => {
            mqttClient.subscribe(GLOBAL_TOPIC);
            setInterval(cleanupDeadStreams, 3000);
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.action === 'live') {
                    activeStreamsMap[data.peerId] = { ...data.info, lastSeen: Date.now() };
                    renderMenu();
                } else if (data.action === 'offline') {
                    delete activeStreamsMap[data.peerId];
                    renderMenu();
                }
            } catch (e) { }
        });

        function cleanupDeadStreams() {
            const now = Date.now();
            let changed = false;
            for (const id in activeStreamsMap) {
                if (now - activeStreamsMap[id].lastSeen > 12000) {
                    delete activeStreamsMap[id];
                    changed = true;
                }
            }
            if(changed) renderMenu();
        }

        // --- РЕНДЕР МЕНЮ ---
        function renderMenu() {
            const container = document.getElementById('streams-container');
            container.innerHTML = "";
            const streamKeys = Object.keys(activeStreamsMap);

            if (streamKeys.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span>😢</span>
                        Пока никто не стримит...<br>Нажми «ЗАПУСТИТЬ СТРИМ» и стань первым!
                    </div>
                `;
                return;
            }

            streamKeys.forEach(id => {
                const stream = activeStreamsMap[id];
                const isMyStream = (peer && peer.id === id); // Проверяем, наш ли это стрим

                const card = document.createElement('div');
                card.className = "glass-panel stream-item";
                
                let thumbEmoji = ["🎮","🎥","🎤","🎬"][Math.floor(Math.random()*4)];

                card.innerHTML = `
                    <div class="thumb-placeholder">
                        ${thumbEmoji}
                        ${isMyStream ? `<div class="my-stream-badge">ВЫ В ЭФИРЕ</div>` : `<div class="live-badge">LIVE</div>`}
                        <div class="viewers-badge">👁 ${stream.viewers}</div>
                    </div>
                    <div class="stream-meta">
                        <div class="stream-title">${stream.title}</div>
                        <div class="stream-author">${isMyStream ? "Это ваш стрим" : "Стример: " + stream.author}</div>
                    </div>
                `;

                // Если это наш стрим - клик возвращает в панель управления. Иначе - подключает как зрителя.
                if (isMyStream) {
                    card.onclick = () => {
                        document.getElementById('menu-page').style.display = 'none';
                        document.getElementById('stream-page').style.display = 'block';
                        updateFab(false);
                    };
                } else {
                    card.onclick = () => joinStream(id, stream);
                }

                container.appendChild(card);
            });
        }

        // --- ИНТЕРФЕЙС ---
        function handleFabClick() {
            if (isHost || isViewing) {
                document.getElementById('menu-page').style.display = 'none';
                document.getElementById('stream-page').style.display = 'block';
                updateFab(false);
            } else {
                document.getElementById('form-author').value = myNickname.replace("Зритель_", "Стример_");
                toggleModal(true);
            }
        }

        function minimizeStream() {
            document.getElementById('stream-page').style.display = 'none';
            document.getElementById('menu-page').style.display = 'block';
            updateFab(true);
        }

        function updateFab(isMinimized) {
            const fab = document.getElementById('fab-btn');
            if (isMinimized) {
                fab.innerText = "ПЕРЕЙТИ К ТРАНСЛЯЦИИ"; fab.classList.add('active-stream-mode');
            } else {
                fab.innerText = "ЗАПУСТИТЬ СТРИМ"; fab.classList.remove('active-stream-mode');
            }
        }

        function toggleModal(show) { document.getElementById('stream-modal').style.display = show ? 'flex' : 'none'; }
        
        function toggleFullscreen() {
            const wrapper = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) { wrapper.requestFullscreen().catch(err => {}); } 
            else { document.exitFullscreen(); }
        }

        // --- ЛОГИКА ХОСТА ---
        async function startMyStream() {
            const title = document.getElementById('form-title').value || "Стрим без названия";
            const author = document.getElementById('form-author').value || "Аноним";
            const desc = document.getElementById('form-desc').value;
            
            myNickname = author;
            document.getElementById('username-display').innerText = "Вы: " + myNickname;

            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                peer = new Peer();
                peer.on('open', (id) => {
                    isHost = true;
                    toggleModal(false);
                    document.getElementById('menu-page').style.display = 'none';
                    document.getElementById('stream-page').style.display = 'block';
                    document.getElementById('btn-stop-stream').style.display = 'block';
                    document.getElementById('btn-screen-share').style.display = 'block';
                    document.getElementById('live-viewers-count').style.display = 'block';
                    document.getElementById('viewer-reactions').style.display = 'flex'; // Хост тоже может кидать реакции
                    updateFab(false);

                    const videoEl = document.getElementById('main-video');
                    videoEl.srcObject = myStream; videoEl.muted = true;

                    document.getElementById('view-title').innerText = title;
                    document.getElementById('view-author').innerText = "Вы в эфире!";
                    document.getElementById('view-desc').innerText = desc;
                    document.getElementById('chat-messages-box').innerHTML = "";
                    addSystemMessage("Трансляция успешно запущена! Ждем зрителей.");

                    heartbeatInterval = setInterval(() => {
                        document.getElementById('live-viewers-count').innerText = "👁 " + hostConnections.length;
                        const payload = {
                            action: 'live', peerId: id,
                            info: { title, author, desc, viewers: hostConnections.length }
                        };
                        mqttClient.publish(GLOBAL_TOPIC, JSON.stringify(payload));
                    }, 3000);
                });

                peer.on('connection', (conn) => {
                    hostConnections.push(conn);
                    broadcastToViewers({ type: "sys", text: "Новый зритель присоединился!" });
                    addSystemMessage("Новый зритель подключился!");
                    
                    conn.on('data', (data) => {
                        if (data.type === "chat") {
                            addChatMessage(data.user, data.text);
                            broadcastToViewers({ type: "chat", user: data.user, text: data.text });
                        } else if (data.type === "react") {
                            spawnReaction(data.emoji);
                            broadcastToViewers({ type: "react", emoji: data.emoji });
                        }
                    });
                    conn.on('close', () => {
                        hostConnections = hostConnections.filter(c => c !== conn);
                        document.getElementById('live-viewers-count').innerText = "👁 " + hostConnections.length;
                    });
                });

                peer.on('call', (call) => { call.answer(myStream); });

            } catch (e) {
                alert("Ошибка доступа к камере! Проверьте разрешения браузера.");
            }
        }

        // Захват экрана
        async function startScreenShare() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = screenStream.getVideoTracks()[0];
                
                // Заменяем видео у себя
                myStream.removeTrack(myStream.getVideoTracks()[0]);
                myStream.addTrack(videoTrack);
                document.getElementById('main-video').srcObject = myStream;

                // Заменяем видео у всех подключенных зрителей
                for(let key in peer.connections) {
                    let conns = peer.connections[key];
                    for(let i=0; i<conns.length; i++) {
                        if(conns[i].peerConnection) {
                            const sender = conns[i].peerConnection.getSenders().find(s => s.track.kind === 'video');
                            if(sender) sender.replaceTrack(videoTrack);
                        }
                    }
                }

                videoTrack.onended = () => {
                    alert("Показ экрана завершен. Чтобы вернуть камеру, перезапустите стрим.");
                };
            } catch (e) { console.error("Ошибка захвата экрана", e); }
        }

        function broadcastToViewers(obj) {
            hostConnections.forEach(conn => { if(conn.open) conn.send(obj); });
        }

        function stopMyStream() {
            if (!confirm("Точно хотите завершить трансляцию?")) return;
            if(peer) mqttClient.publish(GLOBAL_TOPIC, JSON.stringify({ action: 'offline', peerId: peer.id }));
            
            clearInterval(heartbeatInterval);
            if (myStream) myStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            
            isHost = false; hostConnections = [];
            
            document.getElementById('btn-stop-stream').style.display = 'none';
            document.getElementById('btn-screen-share').style.display = 'none';
            document.getElementById('live-viewers-count').style.display = 'none';
            document.getElementById('stream-page').style.display = 'none';
            document.getElementById('menu-page').style.display = 'block';
            document.getElementById('main-video').srcObject = null;
            updateFab(false);
            renderMenu();
        }

        // --- ЛОГИКА ЗРИТЕЛЯ ---
        function joinStream(targetId, streamData) {
            if (isHost) { alert("Сначала остановите свой эфир!"); return; }

            document.getElementById('menu-page').style.display = 'none';
            document.getElementById('stream-page').style.display = 'block';
            document.getElementById('viewer-reactions').style.display = 'flex';
            document.getElementById('btn-stop-stream').style.display = 'none';
            document.getElementById('btn-screen-share').style.display = 'none';
            document.getElementById('live-viewers-count').style.display = 'none';
            updateFab(false);

            document.getElementById('view-title').innerText = streamData.title;
            document.getElementById('view-author').innerText = `Стример: ${streamData.author}`;
            document.getElementById('view-desc').innerText = streamData.desc || "";
            document.getElementById('chat-messages-box').innerHTML = "";
            
            addSystemMessage(`Подключение к эфиру: ${streamData.title}...`);

            isViewing = true;
            peer = new Peer();

            peer.on('open', () => {
                viewerConn = peer.connect(targetId);
                viewerConn.on('open', () => {
                     addSystemMessage("Вы успешно подключились к чату!");
                });

                viewerConn.on('data', (data) => {
                    if (data.type === "chat") addChatMessage(data.user, data.text);
                    if (data.type === "sys") addSystemMessage(data.text);
                    if (data.type === "react") spawnReaction(data.emoji);
                });

                const call = peer.call(targetId, null);
                call.on('stream', (remoteStream) => {
                    document.getElementById('main-video').srcObject = remoteStream;
                });
                
                viewerConn.on('close', () => {
                    addSystemMessage("Стример завершил трансляцию.");
                    document.getElementById('main-video').srcObject = null;
                });
            });
        }

        // --- ЧАТ И РЕАКЦИИ ---
        function submitChatMessage() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if(!text) return;

            if (isHost) {
                const name = myNickname + " (Стример)";
                addChatMessage(name, text);
                broadcastToViewers({ type: "chat", user: name, text: text });
            } else if (isViewing && viewerConn) {
                addChatMessage(myNickname, text);
                viewerConn.send({ type: "chat", user: myNickname, text: text });
            }
            input.value = "";
        }

        function addChatMessage(user, text) {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML += `<div class="msg"><span class="msg-user">${user}:</span> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMessage(text) {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML += `<div class="msg msg-sys">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('chat-input-field').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') submitChatMessage();
        });

        // Отправка реакции
        function reactAndSend(emoji) {
            spawnReaction(emoji); // Показываем себе
            if (isHost) {
                broadcastToViewers({ type: "react", emoji: emoji }); // Стример шлет зрителям
            } else if (isViewing && viewerConn) {
                viewerConn.send({ type: "react", emoji: emoji }); // Зритель шлет стримеру
            }
        }
        // Для совместимости со старой кнопкой в HTML
        function sendReaction(emoji) { reactAndSend(emoji); }

        function spawnReaction(emoji) {
            const wrapper = document.getElementById('video-wrapper');
            const el = document.createElement('div');
            el.className = 'floating-reaction'; el.innerText = emoji;
            // Случайная позиция по горизонтали от 10% до 80%
            el.style.left = (Math.random() * 70 + 10) + "%"; 
            wrapper.appendChild(el);
            setTimeout(() => el.remove(), 2500); // Удаляем после анимации
        }
    </script>
</body>
</html>

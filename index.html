<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamtube - Живые трансляции</title>
    <!-- PeerJS для P2P Видео и Чата -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- MQTT.js для Глобального поиска стримов без сервера -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        /* Базовые стили - глубокий черно-красный градиент */
        body {
            margin: 0;
            padding: 0;
            background-color: #050000;
            background-image: radial-gradient(circle at 50% 50%, #150000 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 0, 0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #ff0000;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            text-transform: uppercase;
        }

        .container {
            padding: 30px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- ИСТИННЫЙ ЭФФЕКТ LIQUID GLASS (20% прозрачности) --- */
        .glass-panel {
            background: rgba(30, 0, 0, 0.2); /* 20% прозрачности */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 0, 0.3);
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.15), inset 0 0 20px rgba(255, 0, 0, 0.05);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .glass-panel:hover {
            border-color: rgba(255, 0, 0, 0.6);
            box-shadow: 0 10px 40px rgba(255, 0, 0, 0.25);
        }

        /* Сетка стримов */
        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .stream-item {
            padding: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1; 
            justify-content: space-between;
        }

        .stream-item:hover { transform: translateY(-5px); }

        .thumb-placeholder {
            width: 100%; height: 60%;
            background: linear-gradient(45deg, rgba(20,0,0,0.5), rgba(60,0,0,0.5));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,0,0,0.2);
            position: relative; overflow: hidden;
        }

        .live-badge {
            position: absolute; top: 10px; left: 10px;
            background: #ff0000; padding: 4px 8px; font-size: 11px;
            font-weight: bold; border-radius: 4px;
            animation: pulse 1.5s infinite; text-transform: uppercase;
        }

        .viewers-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 11px;
            border-radius: 4px; border: 1px solid rgba(255,0,0,0.3);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
            70% { box-shadow: 0 0 0 8px rgba(255,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); }
        }

        .stream-meta { margin-top: 10px; }
        .stream-title { font-weight: bold; font-size: 1.2em; color: #fff; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .stream-author { color: #ff5555; font-size: 0.9em; }

        /* Пустое состояние (Грустный смайлик) */
        .empty-state {
            text-align: center; padding: 50px 20px; color: #888;
            font-size: 1.2em; grid-column: 1 / -1;
        }
        .empty-state span { font-size: 3em; display: block; margin-bottom: 15px; }

        /* --- КНОПКА СПРАВА СНИЗУ --- */
        .btn-fab {
            position: fixed; bottom: 30px; right: 30px;
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
            color: white; border: 1px solid #ff5555;
            padding: 16px 32px; font-size: 16px; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        .btn-fab:hover { transform: scale(1.05); box-shadow: 0 0 35px #ff0000; }
        .btn-fab.active-stream-mode { background: linear-gradient(135deg, #00aa00 0%, #005500 100%); border-color: #00ff00; box-shadow: 0 0 25px rgba(0, 255, 0, 0.3); }

        /* --- МОДАЛЬНОЕ ОКНО ФОРМЫ --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content { width: 90%; max-width: 500px; padding: 30px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 8px;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,0,0,0.3);
            color: white; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .form-group input:focus { border-color: #ff0000; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 0.85em; color: #bbb; }
        .submit-btn {
            width: 100%; padding: 14px; border-radius: 8px; background: #ff0000;
            color: white; font-weight: bold; border: none; cursor: not-allowed; opacity: 0.5; transition: 0.3s;
        }

        /* --- СТРАНИЦА ПЛЕЕРА --- */
        #stream-page { display: none; }
        .stream-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 15px; }
        @media(max-width: 800px) { .stream-layout { grid-template-columns: 1fr; } }

        video { width: 100%; border-radius: 12px; border: 2px solid #ff0000; background: #000; box-shadow: 0 0 20px rgba(255,0,0,0.2); }
        .info-panel { padding: 20px; margin-top: 15px; }
        
        .chat-panel { display: flex; flex-direction: column; height: 500px; padding: 20px; }
        .chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        .msg { margin-bottom: 10px; font-size: 0.95em; border-bottom: 1px solid rgba(255,0,0,0.1); padding-bottom: 5px; word-wrap: break-word;}
        .msg-user { color: #ff3333; font-weight: bold; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex-grow: 1; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,0,0,0.3); color: white; }
        .chat-input-row button { padding: 10px 20px; background: #ff0000; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;}
        
        .header-controls { display: flex; gap: 15px; }
        .btn-secondary { background: rgba(255,0,0,0.1); border: 1px solid #ff0000; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-secondary:hover { background: #ff0000; }
        
        /* Кнопка стоп стрим (только для хоста) */
        .btn-stop-stream { background: #cc0000; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
        .btn-stop-stream:hover { background: #ff0000; box-shadow: 0 0 15px red; }

        .reactions-bar { display: flex; gap: 10px; margin-top: 15px; }
        .react-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,0,0,0.3); font-size: 20px; padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .react-btn:hover { background: rgba(255,0,0,0.3); transform: scale(1.1); }
        .floating-reaction { position: absolute; bottom: 10%; left: 50%; font-size: 30px; pointer-events: none; animation: floatUp 2s forwards ease-in; z-index: 10; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-300px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">Streamtube</div>
        <div id="username-display" style="color: #aaa; font-weight: bold;"></div>
    </header>

    <!-- МЕНЮ: Доступные трансляции -->
    <div id="menu-page" class="container">
        <h2 style="color: #ff3333; margin-top: 0;">Доступные трансляции</h2>
        <div class="streams-grid" id="streams-container">
            <!-- Сюда вставляются реальные стримы из сети -->
        </div>
    </div>

    <!-- СТРАНИЦА СТРИМА -->
    <div id="stream-page" class="container">
        <div class="header-controls">
            <button class="btn-secondary" onclick="minimizeStream()">← Свернуть в меню</button>
            <button class="btn-stop-stream" id="btn-stop-stream" onclick="stopMyStream()">ОСТАНОВИТЬ СТРИМ ⏹</button>
        </div>
        
        <div class="stream-layout">
            <div>
                <div style="position: relative;" id="video-wrapper">
                    <video id="main-video" autoplay playsinline></video>
                </div>
                <div class="glass-panel info-panel">
                    <h2 id="view-title" style="margin: 0 0 10px 0;">Загрузка...</h2>
                    <p id="view-author" style="color: #ff5555; font-weight: bold; margin: 0 0 10px 0;"></p>
                    <p id="view-desc" style="color: #ccc; line-height: 1.5;"></p>
                    <div id="view-link-container"></div>
                    
                    <div class="reactions-bar" id="viewer-reactions" style="display: none;">
                        <button class="react-btn" onclick="sendReaction('🔥')">🔥</button>
                        <button class="react-btn" onclick="sendReaction('❤️')">❤️</button>
                        <button class="react-btn" onclick="sendReaction('😎')">😎</button>
                    </div>
                </div>
            </div>

            <div class="glass-panel chat-panel">
                <h3 style="margin-top:0; color: #ff3333;">Чат</h3>
                <div class="chat-messages" id="chat-messages-box"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input-field" placeholder="Сообщение...">
                    <button onclick="submitChatMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ПЛАВАЮЩАЯ КНОПКА (FAB) -->
    <button class="btn-fab" id="fab-btn" onclick="handleFabClick()">ЗАПУСТИТЬ СТРИМ</button>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ -->
    <div class="modal-overlay" id="stream-modal">
        <div class="glass-panel modal-content">
            <h3 style="color: #ff0000; text-transform: uppercase; margin-top: 0;">Настройка Streamtube</h3>
            <div class="form-group">
                <label>Название стрима *</label>
                <input type="text" id="form-title" placeholder="Крутой стрим по Minecraft" oninput="validateForm()">
            </div>
            <div class="form-group">
                <label>Ваш Никнейм *</label>
                <input type="text" id="form-author" placeholder="Steve..." oninput="validateForm()">
            </div>
            <div class="form-group">
                <label>Описание (Необязательно)</label>
                <textarea id="form-desc" rows="2" placeholder="Залетайте..."></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка (Необязательно)</label>
                <input type="text" id="form-link" placeholder="https://..." oninput="validateForm()">
            </div>
            <div class="checkbox-group"><input type="checkbox" id="form-cb-age" onchange="validateForm()"><label for="form-cb-age">Вам 10+ Лет</label></div>
            <div class="checkbox-group"><input type="checkbox" id="form-cb-rules" onchange="validateForm()"><label for="form-cb-rules">Стрим не содержит 18+ и корректен</label></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="submit-btn" id="submit-stream-btn" disabled onclick="startMyStream()">НАЧАТЬ ЭФИР</button>
                <button class="submit-btn" style="background:rgba(255,255,255,0.1); opacity:1; cursor:pointer;" onclick="toggleModal(false)">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let peer = null;
        let myStream = null;
        let isHost = false; 
        let isViewing = false;
        
        let hostConnections = []; // Для хоста: список зрителей
        let viewerConn = null; // Для зрителя: связь с хостом
        
        let myNickname = "Зритель_" + Math.floor(Math.random() * 9000);
        document.getElementById('username-display').innerText = "Вы: " + myNickname;

        // Глобальный поиск стримов через MQTT
        // Используем публичный брокер HiveMQ (он стабилен для WebSockets)
        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const GLOBAL_TOPIC = "streamtube_app_live_network_2026_xyz";
        let activeStreamsMap = {}; // Храним стримы из сети
        let heartbeatInterval = null;

        // --- ИНИЦИАЛИЗАЦИЯ СЕТИ (DISCOVERY) ---
        mqttClient.on('connect', () => {
            console.log("Подключено к глобальной сети Streamtube!");
            mqttClient.subscribe(GLOBAL_TOPIC);
            // Каждые 3 секунды очищаем старые стримы (которые закрылись или пропали)
            setInterval(cleanupDeadStreams, 3000);
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.action === 'live') {
                    // Обновляем информацию о стриме (timestamp нужен для понимания, что стрим жив)
                    activeStreamsMap[data.peerId] = { ...data.info, lastSeen: Date.now() };
                    renderMenu();
                } else if (data.action === 'offline') {
                    delete activeStreamsMap[data.peerId];
                    renderMenu();
                }
            } catch (e) { }
        });

        function cleanupDeadStreams() {
            const now = Date.now();
            let changed = false;
            for (const id in activeStreamsMap) {
                // Если от стримера не было сигнала 10 секунд - удаляем из меню
                if (now - activeStreamsMap[id].lastSeen > 10000) {
                    delete activeStreamsMap[id];
                    changed = true;
                }
            }
            if(changed) renderMenu();
        }

        // --- РЕНДЕР МЕНЮ ---
        function renderMenu() {
            const container = document.getElementById('streams-container');
            container.innerHTML = "";
            const streamKeys = Object.keys(activeStreamsMap);

            if (streamKeys.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span>😢</span>
                        Пока нет активных трансляций...<br>Нажми «ЗАПУСТИТЬ СТРИМ» и стань первым!
                    </div>
                `;
                return;
            }

            streamKeys.forEach(id => {
                const stream = activeStreamsMap[id];
                // Если мы сами стример, не показываем свой стрим себе в меню
                if (peer && peer.id === id) return; 

                const card = document.createElement('div');
                card.className = "glass-panel stream-item";
                card.onclick = () => joinStream(id, stream);

                card.innerHTML = `
                    <div class="thumb-placeholder">
                        <div class="live-badge">LIVE</div>
                        <div class="viewers-badge">👁 ${stream.viewers}</div>
                    </div>
                    <div class="stream-meta">
                        <div class="stream-title">${stream.title}</div>
                        <div class="stream-author">Стример: ${stream.author}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- ЛОГИКА ИНТЕРФЕЙСА ФОРМЫ И КНОПКИ FAB ---
        function handleFabClick() {
            if (isHost || isViewing) {
                // Если уже в стриме (стримим или смотрим) и свернули его
                document.getElementById('menu-page').style.display = 'none';
                document.getElementById('stream-page').style.display = 'block';
                updateFab(false);
            } else {
                toggleModal(true);
            }
        }

        function minimizeStream() {
            document.getElementById('stream-page').style.display = 'none';
            document.getElementById('menu-page').style.display = 'block';
            updateFab(true); // Меняем кнопку на зеленую "Перейти к трансляции"
        }

        function updateFab(isMinimized) {
            const fab = document.getElementById('fab-btn');
            if (isMinimized) {
                fab.innerText = "ПЕРЕЙТИ В МЕНЮ СТРИМА";
                fab.classList.add('active-stream-mode');
            } else {
                fab.innerText = "ЗАПУСТИТЬ СТРИМ";
                fab.classList.remove('active-stream-mode');
            }
        }

        function toggleModal(show) {
            document.getElementById('stream-modal').style.display = show ? 'flex' : 'none';
        }

        function validateForm() {
            const title = document.getElementById('form-title').value.trim();
            const author = document.getElementById('form-author').value.trim();
            const link = document.getElementById('form-link').value.trim();
            const cbAge = document.getElementById('form-cb-age').checked;
            const cbRules = document.getElementById('form-cb-rules').checked;
            const btn = document.getElementById('submit-stream-btn');

            let linkValid = link === "" || /^(https?:\/\/)/i.test(link);
            document.getElementById('form-link').style.borderColor = linkValid ? "rgba(255,0,0,0.3)" : "#ff0000";

            if (title && author && linkValid && cbAge && cbRules) {
                btn.removeAttribute('disabled'); btn.style.opacity = "1"; btn.style.cursor = "pointer";
            } else {
                btn.setAttribute('disabled', 'true'); btn.style.opacity = "0.5"; btn.style.cursor = "not-allowed";
            }
        }

        // --- ЛОГИКА ХОСТА (СОЗДАТЕЛЬ СТРИМА) ---
        async function startMyStream() {
            const title = document.getElementById('form-title').value;
            const author = document.getElementById('form-author').value;
            const desc = document.getElementById('form-desc').value;
            const link = document.getElementById('form-link').value;
            
            myNickname = author; // Обновляем свой ник
            document.getElementById('username-display').innerText = "Вы: " + myNickname;

            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                peer = new Peer();
                peer.on('open', (id) => {
                    isHost = true;
                    toggleModal(false);
                    document.getElementById('menu-page').style.display = 'none';
                    document.getElementById('stream-page').style.display = 'block';
                    document.getElementById('btn-stop-stream').style.display = 'block'; // Показываем кнопку СТОП
                    updateFab(false);

                    const videoEl = document.getElementById('main-video');
                    videoEl.srcObject = myStream;
                    videoEl.muted = true; // Стример не слышит сам себя

                    document.getElementById('view-title').innerText = title;
                    document.getElementById('view-author').innerText = "Вы в эфире!";
                    document.getElementById('view-desc').innerText = desc;
                    document.getElementById('chat-messages-box').innerHTML = "";

                    // Запускаем пульс (Heartbeat) в глобальную сеть каждые 3 секунды
                    heartbeatInterval = setInterval(() => {
                        const payload = {
                            action: 'live',
                            peerId: id,
                            info: { title, author, desc, link, viewers: hostConnections.length }
                        };
                        mqttClient.publish(GLOBAL_TOPIC, JSON.stringify(payload));
                    }, 3000);
                });

                // Обработка подключений зрителей
                peer.on('connection', (conn) => {
                    hostConnections.push(conn);
                    conn.on('data', (data) => {
                        if (data.type === "chat") {
                            addChatMessage(data.user, data.text);
                            broadcastToViewers({ type: "chat", user: data.user, text: data.text });
                        } else if (data.type === "react") {
                            spawnReaction(data.emoji);
                            broadcastToViewers({ type: "react", emoji: data.emoji });
                        }
                    });
                    conn.on('close', () => {
                        hostConnections = hostConnections.filter(c => c !== conn);
                    });
                });

                peer.on('call', (call) => { call.answer(myStream); });

            } catch (e) {
                alert("Ошибка доступа к камере. Разрешите доступ в браузере!");
            }
        }

        function broadcastToViewers(obj) {
            hostConnections.forEach(conn => { if(conn.open) conn.send(obj); });
        }

        function stopMyStream() {
            if (!confirm("Точно хотите завершить трансляцию?")) return;
            
            // Отправляем сигнал закрытия в глобальную сеть
            if(peer) mqttClient.publish(GLOBAL_TOPIC, JSON.stringify({ action: 'offline', peerId: peer.id }));
            
            clearInterval(heartbeatInterval);
            if (myStream) myStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            
            isHost = false;
            hostConnections = [];
            
            document.getElementById('btn-stop-stream').style.display = 'none';
            document.getElementById('stream-page').style.display = 'none';
            document.getElementById('menu-page').style.display = 'block';
            document.getElementById('main-video').srcObject = null;
            updateFab(false);
            addChatMessage("Система", "Трансляция завершена.");
        }

        // --- ЛОГИКА ЗРИТЕЛЯ ---
        function joinStream(targetId, streamData) {
            if (isHost) { alert("Вы уже ведете стрим! Сначала остановите его."); return; }

            document.getElementById('menu-page').style.display = 'none';
            document.getElementById('stream-page').style.display = 'block';
            document.getElementById('viewer-reactions').style.display = 'flex';
            document.getElementById('btn-stop-stream').style.display = 'none'; // Зритель не может стопнуть
            updateFab(false);

            document.getElementById('view-title').innerText = streamData.title;
            document.getElementById('view-author').innerText = `Стример: ${streamData.author}`;
            document.getElementById('view-desc').innerText = streamData.desc || "Нет описания";
            document.getElementById('chat-messages-box').innerHTML = "";
            
            if(streamData.link) {
                document.getElementById('view-link-container').innerHTML = `<br><a href="${streamData.link}" target="_blank" style="color:#ff3333;">🔗 Ссылка стримера</a>`;
            } else {
                document.getElementById('view-link-container').innerHTML = "";
            }

            isViewing = true;
            peer = new Peer();

            peer.on('open', () => {
                viewerConn = peer.connect(targetId);
                viewerConn.on('data', (data) => {
                    if (data.type === "chat") addChatMessage(data.user, data.text);
                    if (data.type === "react") spawnReaction(data.emoji);
                });

                const call = peer.call(targetId, null);
                call.on('stream', (remoteStream) => {
                    document.getElementById('main-video').srcObject = remoteStream;
                });
                
                // Если хост отключится
                viewerConn.on('close', () => {
                    addChatMessage("Система", "Стример завершил трансляцию.");
                    document.getElementById('main-video').srcObject = null;
                });
            });
        }

        // --- ЧАТ И РЕАКЦИИ ---
        function submitChatMessage() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if(!text) return;

            if (isHost) {
                addChatMessage(myNickname + " (Стример)", text);
                broadcastToViewers({ type: "chat", user: myNickname + " (Стример)", text: text });
            } else if (isViewing && viewerConn) {
                addChatMessage(myNickname, text);
                viewerConn.send({ type: "chat", user: myNickname, text: text });
            }
            input.value = "";
        }

        function addChatMessage(user, text) {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML += `<div class="msg"><span class="msg-user">${user}:</span> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('chat-input-field').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') submitChatMessage();
        });

        function sendReaction(emoji) {
            if (isViewing && viewerConn) {
                spawnReaction(emoji);
                viewerConn.send({ type: "react", emoji: emoji });
            }
        }

        function spawnReaction(emoji) {
            const wrapper = document.getElementById('video-wrapper');
            const el = document.createElement('div');
            el.className = 'floating-reaction'; el.innerText = emoji;
            el.style.left = (Math.random() * 80 + 10) + "%";
            wrapper.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }
    </script>
</body>
</html>
